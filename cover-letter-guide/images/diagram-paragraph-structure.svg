<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Inter, -apple-system, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="800" height="500" fill="#f8f8f8"/>

  <!-- Title -->
  <text x="400" y="30" font-size="9" font-weight="400" letter-spacing="1.6" fill="#999" text-anchor="middle" text-transform="uppercase">Cover Letter — 5-Paragraph Framework</text>

  <!-- Paragraph 1: HOOK -->
  <rect x="150" y="70" width="500" height="60" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="170" y="95" font-size="8" font-weight="500" fill="#1a1a1a">¶1 HOOK</text>
  <text x="680" y="95" font-size="7" fill="#999">Capture attention</text>

  <!-- Arrow 1 down -->
  <polyline points="400,130 400,150" stroke="#1a1a1a" stroke-width="1.2" fill="none"/>
  <polygon points="400,150 395,140 405,140" fill="#1a1a1a"/>

  <!-- Paragraph 2: WHY THIS FIRM -->
  <rect x="150" y="150" width="500" height="60" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="170" y="175" font-size="8" font-weight="500" fill="#1a1a1a">¶2 WHY THIS FIRM</text>
  <text x="680" y="175" font-size="7" fill="#999">Research + passion</text>

  <!-- Arrow 2 down -->
  <polyline points="400,210 400,230" stroke="#1a1a1a" stroke-width="1.2" fill="none"/>
  <polygon points="400,230 395,220 405,220" fill="#1a1a1a"/>

  <!-- Paragraph 3: YOUR VALUE -->
  <rect x="150" y="230" width="500" height="60" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="170" y="255" font-size="8" font-weight="500" fill="#ffffff">¶3 YOUR VALUE</text>
  <text x="680" y="255" font-size="7" fill="#999">Skills + achievements</text>

  <!-- Arrow 3 down -->
  <polyline points="400,290 400,310" stroke="#1a1a1a" stroke-width="1.2" fill="none"/>
  <polygon points="400,310 395,300 405,300" fill="#1a1a1a"/>

  <!-- Paragraph 4: FIT + CULTURE -->
  <rect x="150" y="310" width="500" height="60" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="170" y="335" font-size="8" font-weight="500" fill="#1a1a1a">¶4 FIT + CULTURE</text>
  <text x="680" y="335" font-size="7" fill="#999">Values alignment</text>

  <!-- Arrow 4 down -->
  <polyline points="400,370 400,390" stroke="#1a1a1a" stroke-width="1.2" fill="none"/>
  <polygon points="400,390 395,380 405,380" fill="#1a1a1a"/>

  <!-- Paragraph 5: CLOSE -->
  <rect x="150" y="390" width="500" height="60" fill="#E85D3A" stroke="#E85D3A" stroke-width="1.2" rx="2"/>
  <text x="170" y="415" font-size="8" font-weight="500" fill="#ffffff">¶5 CLOSE</text>
  <text x="680" y="415" font-size="7" fill="#999">Call to action</text>

  <!-- Figure label -->
  <line x1="350" y1="475" x2="450" y2="475" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="492" font-size="7" fill="#ccc" text-anchor="middle">FIG. 1</text>
</svg>