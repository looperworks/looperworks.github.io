name: Update Job Listings

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live job data
        working-directory: scripts
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: node fetch-jobs.js

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update job listings [automated]"
          file_pattern: "mapvoid/firms.json data/jsearch-discoveries.json"
