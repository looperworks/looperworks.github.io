name: Update Job Listings

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live job data
        working-directory: scripts
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: node fetch-jobs.js

      - name: Sync with remote and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash our changed files
          git stash --include-untracked

          # Get the absolute latest from remote
          git fetch origin main
          git reset --hard origin/main

          # Re-apply our changes on top
          git stash pop

          # Commit and push
          git add mapvoid/firms.json
          git add data/jsearch-discoveries.json || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update job listings [automated]"
          git push origin main
