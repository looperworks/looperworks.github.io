<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Inter, -apple-system, system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8f8f8"/>

  <!-- Title -->
  <text x="400" y="30" font-size="9" font-weight="400" letter-spacing="1.6" fill="#999" text-anchor="middle" text-transform="uppercase">
    GUIDE ECOSYSTEM
  </text>

  <!-- Center node: THRESHOLD (filled orange) -->
  <circle cx="400" cy="260" r="60" fill="#E85D3A" stroke="#E85D3A" stroke-width="1.2"/>
  <text x="400" y="270" font-size="8" font-weight="500" fill="#ffffff" text-anchor="middle">THRESHOLD</text>

  <!-- Top node: Portfolio Guide -->
  <line x1="400" y1="200" x2="400" y2="140" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="330" y="90" width="140" height="50" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="400" y="123" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Portfolio Guide</text>

  <!-- Top-right node: Cover Letter Guide -->
  <line x1="445" y1="305" x2="520" y2="350" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="490" y="365" width="140" height="50" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="560" y="398" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Cover Letter Guide</text>

  <!-- Right node: Resume Guide -->
  <line x1="460" y1="260" x2="550" y2="260" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="550" y="235" width="120" height="50" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="610" y="268" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Resume Guide</text>

  <!-- Bottom-right node: Firm Map -->
  <line x1="445" y1="305" x2="520" y2="350" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="490" y="365" width="140" height="50" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="560" y="398" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Cover Letter Guide</text>

  <!-- Bottom node: Resources -->
  <line x1="400" y1="320" x2="400" y2="395" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="330" y="395" width="140" height="50" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="400" y="428" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Resources</text>

  <!-- Bottom-left node: Blog -->
  <line x1="355" y1="305" x2="280" y2="350" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="170" y="365" width="140" height="50" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="240" y="398" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Blog</text>

  <!-- Left node: Firm Map -->
  <line x1="340" y1="260" x2="250" y2="260" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="130" y="235" width="120" height="50" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="190" y="268" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Firm Map</text>

  <!-- Figure label -->
  <line x1="400" y1="470" x2="400" y2="472" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="485" font-size="7" fill="#ccc" text-anchor="middle">FIG. 1</text>
</svg>