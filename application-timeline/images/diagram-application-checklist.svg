<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Inter, -apple-system, system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" fill="#f8f8f8"/>

  <!-- Title -->
  <text x="400" y="28" font-size="9" font-weight="400" letter-spacing="1.6" fill="#999" text-anchor="middle">APPLICATION PREPARATION CHECKLIST</text>

  <!-- Left Card: BEFORE YOU APPLY -->
  <rect x="30" y="50" width="355" height="280" fill="white" stroke="#e0e0e0" stroke-width="1" rx="2"/>
  <rect x="30" y="50" width="355" height="32" rx="2" fill="#1a1a1a"/>
  <text x="50" y="72" font-size="8" font-weight="600" fill="#ffffff" letter-spacing="0.8">BEFORE YOU APPLY</text>

  <text x="50" y="108" font-size="8" fill="#1a1a1a">Portfolio (8-15 pages, PDF under 10MB)</text>
  <text x="50" y="132" font-size="8" fill="#1a1a1a">Resume (1 page, ATS-friendly format)</text>
  <text x="50" y="156" font-size="8" fill="#1a1a1a">Cover letter template (customize per firm)</text>
  <text x="50" y="180" font-size="8" fill="#1a1a1a">References (2-3 people, ask permission)</text>
  <text x="50" y="204" font-size="8" fill="#1a1a1a">Work samples (3-5 high-res images)</text>
  <text x="50" y="228" font-size="8" fill="#1a1a1a">Email signature template</text>
  <text x="50" y="252" font-size="8" fill="#1a1a1a">LinkedIn profile updated</text>

  <!-- Checkmarks -->
  <text x="40" y="108" font-size="8" fill="#2e7d32">&#x2713;</text>
  <text x="40" y="132" font-size="8" fill="#2e7d32">&#x2713;</text>
  <text x="40" y="156" font-size="8" fill="#2e7d32">&#x2713;</text>
  <text x="40" y="180" font-size="8" fill="#2e7d32">&#x2713;</text>
  <text x="40" y="204" font-size="8" fill="#2e7d32">&#x2713;</text>
  <text x="40" y="228" font-size="8" fill="#2e7d32">&#x2713;</text>
  <text x="40" y="252" font-size="8" fill="#2e7d32">&#x2713;</text>

  <!-- Right Card: RESEARCH THE FIRM -->
  <rect x="415" y="50" width="355" height="280" fill="white" stroke="#e0e0e0" stroke-width="1" rx="2"/>
  <rect x="415" y="50" width="355" height="32" rx="2" fill="#1a1a1a"/>
  <text x="435" y="72" font-size="8" font-weight="600" fill="#ffffff" letter-spacing="0.8">RESEARCH THE FIRM</text>

  <text x="435" y="108" font-size="8" fill="#1a1a1a">Recent projects (last 2-3 years)</text>
  <text x="435" y="132" font-size="8" fill="#1a1a1a">Design philosophy / mission statement</text>
  <text x="435" y="156" font-size="8" fill="#1a1a1a">Current job postings</text>
  <text x="435" y="180" font-size="8" fill="#1a1a1a">Size and office locations</text>
  <text x="435" y="204" font-size="8" fill="#1a1a1a">Who reviews applications</text>
  <text x="435" y="228" font-size="8" fill="#1a1a1a">Awards and recognition</text>
  <text x="435" y="252" font-size="8" fill="#1a1a1a">Team leads and principals</text>

  <text x="425" y="108" font-size="8" fill="#2e7d32">&#x2713;</text>
  <text x="425" y="132" font-size="8" fill="#2e7d32">&#x2713;</text>
  <text x="425" y="156" font-size="8" fill="#2e7d32">&#x2713;</text>
  <text x="425" y="180" font-size="8" fill="#2e7d32">&#x2713;</text>
  <text x="425" y="204" font-size="8" fill="#2e7d32">&#x2713;</text>
  <text x="425" y="228" font-size="8" fill="#2e7d32">&#x2713;</text>
  <text x="425" y="252" font-size="8" fill="#2e7d32">&#x2713;</text>

  <!-- Pro Tip Box -->
  <rect x="30" y="355" width="740" height="55" fill="none" stroke="#E85D3A" stroke-width="1.2" stroke-dasharray="4,3" rx="2"/>
  <text x="50" y="378" font-size="9" font-weight="700" fill="#E85D3A">PRO TIP:</text>
  <text x="50" y="396" font-size="7.5" fill="#666">The cover letter and portfolio should reference the firm's specific work. Generic applications get filtered out immediately.</text>

  <!-- Figure label -->
  <line x1="400" y1="430" x2="400" y2="432" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="450" font-size="7" fill="#ccc" text-anchor="middle">FIG. 4</text>
</svg>
