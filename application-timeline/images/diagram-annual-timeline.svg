<svg viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Inter, -apple-system, system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" fill="#f8f8f8"/>

  <!-- Title -->
  <text x="400" y="28" font-size="9" font-weight="400" letter-spacing="1.6" fill="#999" text-anchor="middle">THE ARCHITECTURE HIRING YEAR</text>

  <!-- Phase backgrounds -->
  <!-- Research & Prepare: Sep-Nov (outlined) -->
  <rect x="45" y="65" width="145" height="36" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="117" y="88" font-size="7.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">Research &amp; Prepare</text>

  <!-- Peak Application Season: Dec-Mar (filled #1a1a1a) -->
  <rect x="216" y="65" width="202" height="36" fill="#1a1a1a" rx="2"/>
  <text x="317" y="88" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">Peak Application Season</text>

  <!-- Late Opportunities: Apr-Jun (filled #E85D3A) -->
  <rect x="444" y="65" width="144" height="36" fill="#E85D3A" rx="2"/>
  <text x="516" y="88" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">Late Opportunities</text>

  <!-- Internship Season: Jul-Aug (dashed outlined) -->
  <rect x="615" y="65" width="130" height="36" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="4,3" rx="2"/>
  <text x="680" y="88" font-size="7.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">Internship Season</text>

  <!-- Timeline base line -->
  <line x1="60" y1="120" x2="740" y2="120" stroke="#ccc" stroke-width="1.2"/>

  <!-- Month markers and labels -->
  <circle cx="60" cy="120" r="3" fill="#1a1a1a"/>
  <text x="60" y="140" font-size="8" fill="#666" text-anchor="middle">Sep</text>

  <circle cx="117" cy="120" r="3" fill="#1a1a1a"/>
  <text x="117" y="140" font-size="8" fill="#666" text-anchor="middle">Oct</text>

  <circle cx="174" cy="120" r="3" fill="#1a1a1a"/>
  <text x="174" y="140" font-size="8" fill="#666" text-anchor="middle">Nov</text>

  <circle cx="231" cy="120" r="3" fill="#1a1a1a"/>
  <text x="231" y="140" font-size="8" fill="#666" text-anchor="middle">Dec</text>

  <circle cx="288" cy="120" r="3" fill="#1a1a1a"/>
  <text x="288" y="140" font-size="8" fill="#666" text-anchor="middle">Jan</text>

  <circle cx="345" cy="120" r="3" fill="#1a1a1a"/>
  <text x="345" y="140" font-size="8" fill="#666" text-anchor="middle">Feb</text>

  <circle cx="402" cy="120" r="3" fill="#1a1a1a"/>
  <text x="402" y="140" font-size="8" fill="#666" text-anchor="middle">Mar</text>

  <circle cx="459" cy="120" r="3" fill="#1a1a1a"/>
  <text x="459" y="140" font-size="8" fill="#666" text-anchor="middle">Apr</text>

  <circle cx="516" cy="120" r="3" fill="#1a1a1a"/>
  <text x="516" y="140" font-size="8" fill="#666" text-anchor="middle">May</text>

  <circle cx="573" cy="120" r="3" fill="#1a1a1a"/>
  <text x="573" y="140" font-size="8" fill="#666" text-anchor="middle">Jun</text>

  <circle cx="630" cy="120" r="3" fill="#1a1a1a"/>
  <text x="630" y="140" font-size="8" fill="#666" text-anchor="middle">Jul</text>

  <circle cx="687" cy="120" r="3" fill="#1a1a1a"/>
  <text x="687" y="140" font-size="8" fill="#666" text-anchor="middle">Aug</text>

  <!-- Legend -->
  <rect x="100" y="180" width="14" height="14" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="122" y="191" font-size="7" fill="#666">Prepare</text>

  <rect x="210" y="180" width="14" height="14" fill="#1a1a1a" rx="2"/>
  <text x="232" y="191" font-size="7" fill="#666">Apply</text>

  <rect x="300" y="180" width="14" height="14" fill="#E85D3A" rx="2"/>
  <text x="322" y="191" font-size="7" fill="#666">Late opportunities</text>

  <rect x="440" y="180" width="14" height="14" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3,2" rx="2"/>
  <text x="462" y="191" font-size="7" fill="#666">Internship season</text>

  <!-- Figure label -->
  <line x1="400" y1="250" x2="400" y2="252" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="268" font-size="7" fill="#ccc" text-anchor="middle">FIG. 1</text>
</svg>
