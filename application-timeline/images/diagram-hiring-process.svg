<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Inter, -apple-system, system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#f8f8f8"/>

  <!-- Title -->
  <text x="400" y="28" font-size="9" font-weight="400" letter-spacing="1.6" fill="#999" text-anchor="middle">THE ARCHITECTURE HIRING PROCESS</text>

  <!-- Node 1: Portfolio + Resume + Cover Letter -->
  <rect x="30" y="60" width="120" height="70" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="90" y="88" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Portfolio +</text>
  <text x="90" y="100" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Resume +</text>
  <text x="90" y="112" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Cover Letter</text>

  <!-- Arrow 1→2 -->
  <polyline points="150,95 170,95" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <polygon points="175,95 170,92 170,98" fill="#1a1a1a"/>
  <text x="162" y="85" font-size="7" fill="#999" text-anchor="middle">1-3 wks</text>

  <!-- Node 2: Application Submitted -->
  <rect x="180" y="60" width="120" height="70" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="240" y="92" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Application</text>
  <text x="240" y="104" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Submitted</text>

  <!-- Arrow 2→3 -->
  <polyline points="300,95 320,95" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <polygon points="325,95 320,92 320,98" fill="#1a1a1a"/>
  <text x="312" y="85" font-size="7" fill="#999" text-anchor="middle">1-2 wks</text>

  <!-- Node 3: Phone/Video Screen -->
  <rect x="330" y="60" width="120" height="70" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="390" y="92" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Phone/Video</text>
  <text x="390" y="104" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">Screen</text>

  <!-- Arrow 3→4 -->
  <polyline points="450,95 470,95" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <polygon points="475,95 470,92 470,98" fill="#1a1a1a"/>
  <text x="462" y="85" font-size="7" fill="#999" text-anchor="middle">1 wk</text>

  <!-- Node 4: Portfolio Walkthrough (dark filled) -->
  <rect x="480" y="60" width="130" height="70" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="545" y="92" font-size="8" font-weight="500" fill="#ffffff" text-anchor="middle">Portfolio</text>
  <text x="545" y="104" font-size="8" font-weight="500" fill="#ffffff" text-anchor="middle">Walkthrough</text>

  <!-- Arrow 4→5 -->
  <polyline points="610,95 630,95" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <polygon points="635,95 630,92 630,98" fill="#1a1a1a"/>
  <text x="622" y="85" font-size="7" fill="#999" text-anchor="middle">1-5 d</text>

  <!-- Node 5: Offer (accent filled) -->
  <rect x="640" y="60" width="120" height="70" fill="#E85D3A" stroke="#E85D3A" stroke-width="1.2" rx="2"/>
  <text x="700" y="100" font-size="9" font-weight="500" fill="#ffffff" text-anchor="middle">Offer</text>

  <!-- Notes box -->
  <rect x="50" y="170" width="700" height="85" fill="none" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="70" y="192" font-size="8" font-weight="600" fill="#1a1a1a">TIMELINE NOTES:</text>
  <text x="70" y="210" font-size="7.5" fill="#999">Most architecture firms review applications in batches during peak season (Dec-Mar)</text>
  <text x="70" y="225" font-size="7.5" fill="#999">Phone/video screens typically happen within 1-2 weeks of application submission</text>
  <text x="70" y="240" font-size="7.5" fill="#999">Portfolio walkthroughs are conducted by senior architects or principals</text>

  <!-- Figure label -->
  <line x1="400" y1="275" x2="400" y2="277" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="292" font-size="7" fill="#ccc" text-anchor="middle">FIG. 2</text>
</svg>
