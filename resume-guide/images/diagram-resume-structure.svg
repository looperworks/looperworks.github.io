<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Inter, -apple-system, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="800" height="400" fill="#f8f8f8"/>

  <!-- Title -->
  <text x="400" y="30" font-size="9" font-weight="400" letter-spacing="1.6" fill="#999" text-anchor="middle" text-transform="uppercase">Resume Layout Approaches</text>

  <!-- STANDARD Section -->
  <text x="200" y="70" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">STANDARD</text>

  <!-- Standard: Header -->
  <rect x="100" y="90" width="200" height="35" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="110" y="112" font-size="7" font-weight="500" fill="#1a1a1a">HEADER</text>

  <!-- Standard: Education -->
  <rect x="100" y="135" width="200" height="35" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="110" y="157" font-size="7" font-weight="500" fill="#1a1a1a">EDUCATION</text>

  <!-- Standard: Experience -->
  <rect x="100" y="180" width="200" height="35" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="110" y="202" font-size="7" font-weight="500" fill="#1a1a1a">EXPERIENCE</text>

  <!-- Standard: Skills -->
  <rect x="100" y="225" width="200" height="35" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="110" y="247" font-size="7" font-weight="500" fill="#1a1a1a">SKILLS</text>

  <!-- DESIGN-FORWARD Section -->
  <text x="600" y="70" font-size="8" font-weight="500" fill="#1a1a1a" text-anchor="middle">DESIGN-FORWARD</text>

  <!-- Design-Forward: Header (filled) -->
  <rect x="500" y="90" width="200" height="35" fill="#E85D3A" stroke="#E85D3A" stroke-width="1.2" rx="2"/>
  <text x="510" y="112" font-size="7" font-weight="500" fill="#ffffff">HEADER</text>

  <!-- Design-Forward: Left column background -->
  <rect x="500" y="135" width="60" height="125" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="515" y="155" font-size="7" font-weight="500" fill="#1a1a1a">CONTACT</text>
  <text x="520" y="170" font-size="7" font-weight="500" fill="#1a1a1a">SKILLS</text>

  <!-- Design-Forward: Right column background -->
  <rect x="570" y="135" width="130" height="125" fill="none" stroke="#1a1a1a" stroke-width="1.2" rx="2"/>
  <text x="580" y="155" font-size="7" font-weight="500" fill="#1a1a1a">EXPERIENCE</text>
  <text x="580" y="170" font-size="7" font-weight="500" fill="#1a1a1a">PROJECTS</text>

  <!-- Figure label -->
  <line x1="350" y1="360" x2="450" y2="360" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="377" font-size="7" fill="#ccc" text-anchor="middle">FIG. 1</text>
</svg>